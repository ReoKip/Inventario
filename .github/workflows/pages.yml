# Publica la app web en GitHub Pages cada vez que cambia main o beta:
#   https://reokip.github.io/Inventario/       ← rama main (versión de los usuarios)
#   https://reokip.github.io/Inventario/beta/  ← rama beta (versión de prueba)
name: Publicar app web

on:
  push:
    branches: [main, beta]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # GitHub solo deja publicar desde main. Si el cambio llegó a beta, se le pide a main
  # que vuelva a armar y publicar el sitio (que incluye la beta).
  pedir-publicacion:
    if: github.ref == 'refs/heads/beta'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - run: gh workflow run pages.yml --ref main -R "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Versión normal (main)
        uses: actions/checkout@v4
        with:
          ref: main
          path: main
      - name: Versión de prueba (beta)
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          ref: beta
          path: beta
      - name: Armar el sitio
        run: bash main/.github/build-site.sh main beta site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
